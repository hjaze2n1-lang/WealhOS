  <body>
    <div id="root"></div>
    <script>
      const redirectPath = sessionStorage.getItem('github-pages-redirect')

        sessionStorage.removeItem('github-pages-redirect')
        history.replaceState(null, '', redirectPath)
      }
    </script>

  </body>
